# Compress text assets. nginx.conf already has `gzip on;` — default gzip_types
# is HTML-only, which left JS/CSS uncompressed and tanked mobile PSI.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/ld+json
  application/xml
  application/rss+xml
  application/atom+xml
  application/manifest+json
  image/svg+xml
  font/ttf
  font/otf
  font/woff
  font/woff2
  application/font-woff
  application/font-woff2;
