# Gemini / LLM crawlers need a real text/plain body — never the SPA HTML shell.
location = /llms.txt {
    root /var/www/zeorbit-website;
    default_type text/plain;
    charset utf-8;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Robots-Tag "all" always;
    try_files /llms.txt =404;
}

location = /.well-known/llms.txt {
    root /var/www/zeorbit-website;
    default_type text/plain;
    charset utf-8;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /llms.txt =404;
}

# Branded USA-only page (used by error_page 418).
location @us_only {
    root /var/www/zeorbit-website;
    default_type text/html;
    charset utf-8;
    try_files /us-only.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Type "text/html; charset=utf-8" always;
}

location = /us-only.html {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Type "text/html; charset=utf-8" always;
}
