# Must be included at the top of the server{} (before locations).
# if/rewrite in a snippet that also defines location{} is ignored by nginx.
set $zeorbit_ok $zeorbit_access;
if ($remote_addr ~ "^(127\.0\.0\.1|::1)$") { set $zeorbit_ok 1; }
if ($uri = /us-only.html) { set $zeorbit_ok 1; }
if ($uri = /zeorbit-logo.webp) { set $zeorbit_ok 1; }
if ($uri = /zeorbit-logo-nav.webp) { set $zeorbit_ok 1; }
if ($zeorbit_ok != 1) {
    rewrite ^ /us-only.html last;
}
