# Included from http {} via /etc/nginx/conf.d/
geoip2 /usr/share/GeoIP/dbip-country-lite.mmdb {
    auto_reload 6h;
    $geoip2_country_code country iso_code;
}

geo $zeorbit_local {
    default 0;
    127.0.0.1 1;
    ::1 1;
}

# $uri (not $request_uri) so rewritten /us-only.html is allowed.
map $uri $zeorbit_public_file {
    default 0;
    /us-only.html 1;
    /zeorbit-logo.webp 1;
    /zeorbit-logo-nav.webp 1;
    /favicon.png 1;
    /llms.txt 1;
    /.well-known/llms.txt 1;
    /robots.txt 1;
    /sitemap.xml 1;
    /page-sitemap.xml 1;
    /post-sitemap.xml 1;
    ~*^/\.well-known/ 1;
}

# Only United States GeoIP (or a US VPN). No staff IPs, no User-Agent crawler bypass.
map $geoip2_country_code$zeorbit_public_file $zeorbit_access {
    default 0;
    ~^US 1;
    ~1$ 1;
}

map $zeorbit_access$zeorbit_local $zeorbit_ok {
    default 0;
    ~1 1;
}

limit_req_zone $binary_remote_addr zone=zeorbit_leads:10m rate=8r/m;
limit_req_zone $binary_remote_addr zone=zeorbit_api:10m rate=30r/s;
server_tokens off;
