# Production: /etc/nginx/sites-enabled/seo-tool
# Product UI is US-geo-gated (same as zeorbit.com). Staff IPs in geoip2.conf can still open it.
# Public host: seo.zeorbit.com  (DNS A -> 159.198.79.219)
# Legacy host: seo.159.198.79.219.nip.io

server {
    listen 80;
    server_name seo.zeorbit.com seo.159.198.79.219.nip.io;
    include /etc/nginx/snippets/zeorbit-geo-rewrite.conf;

    root /var/www/seo-tool;
    index index.html;
    include /etc/nginx/snippets/zeorbit-security.conf;
    include /etc/nginx/snippets/zeorbit-geo-us.conf;

    location = /index.html {
        include /etc/nginx/snippets/zeorbit-geo-gate.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/zeorbit-geo-gate.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 20M;
    }

    location = /health   { proxy_pass http://127.0.0.1:8001/health; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8001/openapi.json; }
    location /docs        { proxy_pass http://127.0.0.1:8001; }

    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /page-sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /post-sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /p/ {
        rewrite ^/p/(.*)$ https://zeorbit.com/$1 permanent;
    }
}
