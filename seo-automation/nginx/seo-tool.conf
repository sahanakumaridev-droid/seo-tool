# Production: /etc/nginx/sites-enabled/seo-tool
# United States only for the SEO product UI (HTML). /api/ is not geo-gated so
# authenticated tooling keeps working; React UsaGate also enforces US visitors.
# Public host: seo.zeorbit.com  (DNS A -> 159.198.79.219)
# Legacy host: seo.159.198.79.219.nip.io
# Do not rsync a listen-80-only file over this — HTTPS 400 follows.

server {
    listen 443 ssl http2;
    server_name seo.zeorbit.com seo.159.198.79.219.nip.io;

    ssl_certificate /etc/letsencrypt/live/seo.159.198.79.219.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seo.159.198.79.219.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/seo-tool;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/zeorbit-security.conf;
    include /etc/nginx/snippets/zeorbit-geo-us.conf;
    error_page 418 =200 @us_only;

    location = /index.html {
        if ($zeorbit_ok = 0) { return 418; }
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~ ^/(content|login|dashboard|preview|articles|onboarding|settings|leads|keywords)(/.*)?$ {
        if ($zeorbit_ok = 0) { return 418; }
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location / {
        if ($zeorbit_ok = 0) { return 418; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        client_max_body_size 20M;
    }

    location = /health   { proxy_pass http://127.0.0.1:8001/health; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8001/openapi.json; }
    location /docs        { proxy_pass http://127.0.0.1:8001; }

    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /page-sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /post-sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /p/ {
        rewrite ^/p/(.*)$ https://zeorbit.com/$1 permanent;
    }
}

server {
    listen 80;
    server_name seo.zeorbit.com seo.159.198.79.219.nip.io;
    return 301 https://$host$request_uri;
}
