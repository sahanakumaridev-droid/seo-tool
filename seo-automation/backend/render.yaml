services:
  - type: web
    name: zeorbit-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zeorbit-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: zeorbit-db
    databaseName: seo_automation
    user: zeorbit
    plan: free
